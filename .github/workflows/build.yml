name: Build PixelGram

on:
  push:
    branches:
      - master # Замени на main, если у тебя основная ветка называется main

jobs:
  build:
    runs-on: ubuntu-latest

    # Права нужны для автоматического создания релиза
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # В твоих логах выше мелькала Java 21, поэтому ставим её
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Cache C++ and Gradle build files
        uses: actions/cache@v4
        with:
          path: |
            .gradle/
            TMessagesProj/.cxx/
            TMessagesProj/build/
            TMessagesProj_App/build/
          # Ключ кэша обновляется при каждом коммите, но восстанавливается из ближайшего старого
          key: ${{ runner.os }}-tg-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tg-build-

      - name: Prepare Keystore and google-services.json
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # 1. Декодируем keystore из base64 в файл
          echo $KEYSTORE_BASE64 | base64 --decode > TMessagesProj/config/release.keystore
          
          # 2. Создаем файл google-services.json из секрета
          echo "$GOOGLE_SERVICES_JSON" > TMessagesProj_App/google-services.json
          
          # Если сборка попросит пустой Huawei-конфиг, можно раскомментировать строку ниже:
          # echo "{}" > TMessagesProj_AppHuawei/agconnect-services.json

      - name: Configure Signing in gradle.properties
        run: |
          # Телеграм читает ключи из gradle.properties, поэтому безопасно дописываем их туда
          cat << EOF >> gradle.properties
          RELEASE_STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build PixelGram APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatRelease -x test -x :TMessagesProj_AppTests:generateScheme --build-cache

      - name: Prepare APK and Tag
        id: prep
        run: |
          # Ищем собранный APK
          APK_PATH=$(find TMessagesProj_App/build/outputs/apk/afat/release -name "*.apk" | head -n 1)
          mv "$APK_PATH" PixelGram.apk
          
          # Читаем версию напрямую из TMessagesProj/build.gradle
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' TMessagesProj/build.gradle)
          VERSION_CODE=$(grep -oP 'versionCode = \K\d+' TMessagesProj/build.gradle)
          
          # Формируем красивый тег, например: v10.14.0-41410
          FINAL_TAG="v${VERSION_NAME}-${VERSION_CODE}"
          
          echo "TAG_NAME=$FINAL_TAG" >> $GITHUB_ENV
          echo "RELEASE_NAME=PixelGram $VERSION_NAME" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          files: PixelGram.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}