name: Build PixelGram

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Cache C++ and Gradle build files
        uses: actions/cache@v4
        with:
          path: |
            .gradle/
            TMessagesProj/.cxx/
            TMessagesProj/build/
            TMessagesProj_AppStandalone/build/
          key: ${{ runner.os }}-tg-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tg-build-

      - name: Prepare Keystore and google-services.json
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > TMessagesProj/config/release.keystore          
          echo "$GOOGLE_SERVICES_JSON" > google-services.json
      - name: Configure Signing in gradle.properties
        run: |
          cat << EOF >> gradle.properties
          RELEASE_STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build PixelGram APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatRelease -x test -x :TMessagesProj_AppTests:generateScheme --build-cache

      - name: Prepare APK and Tag
        id: prep
        run: |
          # Ищем APK везде внутри outputs, исключая возможные промежуточные (unaligned) файлы
          APK_PATH=$(find TMessagesProj_AppStandalone/build/outputs -type f -name "*.apk" | grep -v "unaligned" | head -n 1)
          
          # Защита: если файл не найден, выводим структуру директорий для дебага и падаем понятно
          if [ -z "$APK_PATH" ]; then
            echo "APK не найден! Вывожу структуру папок:"
            ls -R TMessagesProj_AppStandalone/build/outputs
            exit 1
          fi
          
          mv "$APK_PATH" PixelGram.apk
          
          # Читаем версию независимо от того, есть там знак '=' или просто пробел
          VERSION_NAME=$(grep -oP 'versionName\s*=?\s*"\K[^"]+' TMessagesProj/build.gradle)
          VERSION_CODE=$(grep -oP 'versionCode\s*=?\s*\K\d+' TMessagesProj/build.gradle)
          
          # Формируем красивый тег, например: v10.14.0-41410
          FINAL_TAG="v${VERSION_NAME}-${VERSION_CODE}"
          
          echo "TAG_NAME=$FINAL_TAG" >> $GITHUB_ENV
          echo "RELEASE_NAME=PixelGram $VERSION_NAME" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          files: PixelGram.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}