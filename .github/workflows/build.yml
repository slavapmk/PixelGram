name: Build PixelGram

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Git file modification times
        uses: chetan/git-restore-mtime-action@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Cache C++ and Gradle build files
        uses: actions/cache@v4
        with:
          path: |
            .gradle/
            TMessagesProj/.cxx/
            TMessagesProj/build/
            TMessagesProj_AppStandalone/build/
          key: ${{ runner.os }}-tg-cxx-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tg-cxx-${{ github.ref_name }}-
            ${{ runner.os }}-tg-cxx-

      - name: Pre-install and backdate NDK (C++ Cache Hack)
        run: |
          echo "Устанавливаем NDK заранее..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" || true
          echo "Откатываем время NDK в 2000 год, чтобы обмануть компилятор CMake..."
          sudo find $ANDROID_HOME/ndk -type f -exec touch -d "2000-01-01 00:00:00" {} +

      - name: Prepare Keystore and google-services.json
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > TMessagesProj/config/release.keystore          
          
          # Копируем свежий JSON от Firebase прямо в папки модулей, чтобы плагин их увидел
          echo "$GOOGLE_SERVICES_JSON" > TMessagesProj/google-services.json
          echo "$GOOGLE_SERVICES_JSON" > TMessagesProj_AppStandalone/google-services.json
          echo "$GOOGLE_SERVICES_JSON" > TMessagesProj_App/google-services.json

      - name: Configure Signing in gradle.properties
        run: |
          cat << EOF >> gradle.properties
          RELEASE_STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build PixelGram APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatRelease -x test -x :TMessagesProj_AppTests:generateScheme --build-cache

      - name: Prepare and Sign APK
        id: prep
        run: |
          echo "=== Поиск сгенерированного APK ==="
          APK_PATH=$(find TMessagesProj_AppStandalone/build/outputs -type f -name "*.apk" 2>/dev/null | grep -v "unaligned" | head -n 1 || true)
          
          if [ -z "$APK_PATH" ]; then
            echo "APK не найден!"
            exit 1
          fi
          
          echo "APK: $APK_PATH"
          
          BUILD_TOOLS_DIR=$(ls -1d $ANDROID_HOME/build-tools/* | tail -n 1)
          
          $BUILD_TOOLS_DIR/zipalign -v -p -f 4 "$APK_PATH" PixelGram-aligned.apk
          
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks TMessagesProj/config/release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            PixelGram-aligned.apk
          
          mv PixelGram-aligned.apk PixelGram.apk
          
          echo "=== Парсинг версии из gradle.properties ==="
          VERSION_NAME=$(grep -oP '^APP_VERSION_NAME=\K.*' gradle.properties | tr -d '\r' || true)
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="12.9.2"; fi
          
          FINAL_TAG="v${VERSION_NAME}"
          echo "Тег релиза: $FINAL_TAG"
          
          echo "TAG_NAME=$FINAL_TAG" >> $GITHUB_ENV
          echo "RELEASE_NAME=PixelGram $VERSION_NAME" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          files: PixelGram.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}